<h1 style="font-family:Oswald, 'Trebuchet MS', sans-serif;font-size:132px;font-weight:600;line-height:1;width:1400px">Open Lineup</h1>
<p style="font-size:40px;line-height:1.3;width:1100px;color:#F4F1EA">An open‑source beach station that lets people who cannot reach the sand, or the water, ride along live: satellite link, 360° cameras, eye‑gaze control, and a light that follows one surfer after dark.</p>
<p style="font-size:24px;color:#C9D3DC">First pilot: Playa de Benijo and Almáciga, Tenerife · 2027</p>
